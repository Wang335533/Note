name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      note_version: ${{ steps.version.outputs.note_version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          echo "note_version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run package:installer
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed with exit code $LASTEXITCODE."
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $installerName = "Note-${{ needs.validate.outputs.note_version }}-setup.exe"
          $installerPath = Join-Path release $installerName
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Expected installer was not created: $installerPath"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: note-windows
          path: release/Note-${{ needs.validate.outputs.note_version }}-setup.exe
          if-no-files-found: error
          retention-days: 3

  build-macos:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build universal macOS DMG
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify macOS artifact
        shell: bash
        run: |
          dmg="release/Note-${{ needs.validate.outputs.note_version }}-mac.dmg"
          test -f "${dmg}"
          hdiutil verify "${dmg}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: note-macos
          path: release/Note-${{ needs.validate.outputs.note_version }}-mac.dmg
          if-no-files-found: error
          retention-days: 3

  publish:
    needs:
      - validate
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: note-*
          path: release
          merge-multiple: true

      - name: Create cross-platform SHA-256 checksums
        shell: bash
        run: |
          version="${{ needs.validate.outputs.note_version }}"
          windows="Note-${version}-setup.exe"
          macos="Note-${version}-mac.dmg"
          test -f "release/${windows}"
          test -f "release/${macos}"
          (
            cd release
            sha256sum "${windows}" "${macos}" > SHA256SUMS.txt
          )

      - name: Publish GitHub Release atomically
        shell: bash
        run: |
          version="${{ needs.validate.outputs.note_version }}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing_draft="$(gh release view "${GITHUB_REF_NAME}" \
              --json isDraft \
              --jq '.isDraft' \
              --repo "${GITHUB_REPOSITORY}")"
            if [[ "${existing_draft}" == "false" ]]; then
              echo "Release ${GITHUB_REF_NAME} is already published; immutable releases are never overwritten."
              exit 0
            fi
          else
            notes=$'Windows：下载 Note-'"${version}"$'-setup.exe。\n\nmacOS：下载 Note-'"${version}"$'-mac.dmg（Intel 与 Apple Silicon 通用）。当前 macOS 版使用临时签名、未经过 Apple 公证，首次打开时需在“系统设置 → 隐私与安全性”中确认。'
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --notes "${notes}" \
              --title "Note ${version}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            "release/Note-${version}-setup.exe" \
            "release/Note-${version}-mac.dmg" \
            release/SHA256SUMS.txt \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
