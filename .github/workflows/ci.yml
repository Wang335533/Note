name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-tests:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production renderer
        run: npm run build

  test-and-build:
    name: test-and-build
    if: always()
    needs: platform-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every supported platform to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
        run: |
          if [ "${PLATFORM_RESULT}" != "success" ]; then
            echo "At least one supported platform failed validation." >&2
            exit 1
          fi
